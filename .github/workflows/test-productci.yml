name: Product API CI thử nghiệm

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  basic-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v6

      - name: Cài Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Cài thư viện
        run: npm ci

      - name: Kiểm tra cú pháp JavaScript
        run: |
          node --check server.js
          node --check models/Product.js
          node --check routes/products.js

      - name: Kiểm tra tạo Docker image
        run: docker build -t product-api:ci .