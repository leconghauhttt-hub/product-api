services:
  nammongodb:
    image: mongo:8.0-noble
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "exit(db.adminCommand({ ping: 1 }).ok ? 0 : 1)"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  api:
    build: .
    env_file:
      - .env.docker
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      nammongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s    
    restart: on-failure

volumes:
  mongodb_data: